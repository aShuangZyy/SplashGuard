name: SplashGuard
options:
  bundleIdPrefix: com.splashguard
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: "NO"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"

targets:
  SplashGuard:
    type: application
    platform: iOS
    sources:
      - path: SplashGuard/App
      - path: SplashGuard/Core
      - path: SplashGuard/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splashguard.app
        PRODUCT_NAME: SplashGuard
        INFOPLIST_FILE: SplashGuard/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: SplashGuard/Entitlements/App.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false
    dependencies:
      - target: SplashGuardTunnel
        embed: true

  SplashGuardTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: SplashGuard/Tunnel
      - path: SplashGuard/Core
      - path: SplashGuard/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splashguard.app.tunnel
        PRODUCT_NAME: SplashGuardTunnel
        INFOPLIST_FILE: SplashGuard/Info-Tunnel.plist
        CODE_SIGN_ENTITLEMENTS: SplashGuard/Entitlements/Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # 最小诊断 App：不碰 NetworkExtension、不读规则表、不加载任何资源。
  # 用来二分「闪退是签名/工具链问题」还是「我们代码问题」。
  SplashGuardMini:
    type: application
    platform: iOS
    sources:
      - path: Mini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splashguard.mini
        PRODUCT_NAME: SplashGuardMini
        INFOPLIST_FILE: Mini/Info-Mini.plist
        CODE_SIGN_ENTITLEMENTS: SplashGuard/Entitlements/Mini.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false

  # 纯 Objective-C 对照 App：完全不链接 Swift 运行时。
  # 它闪退 = 签名/TrollStore/系统问题；它能开 = 问题出在 Swift 工具链。
  SGMiniObjC:
    type: application
    platform: iOS
    sources:
      - path: MiniObjC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splashguard.miniobjc
        PRODUCT_NAME: SGMiniObjC
        INFOPLIST_FILE: MiniObjC/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplashGuard/Entitlements/Mini.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    scheme:
      gatherCoverageData: false

  # Swift 版但把工具链自带的 Swift 运行时打进包里（Frameworks/），
  # 绕开 iOS 14.2 自带的 5.3 stdlib 与新编译器不匹配的问题。
  SGMiniEmb:
    type: application
    platform: iOS
    sources:
      - path: Mini
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splashguard.miniemb
        PRODUCT_NAME: SGMiniEmb
        INFOPLIST_FILE: Mini/Info-MiniEmb.plist
        CODE_SIGN_ENTITLEMENTS: SplashGuard/Entitlements/Mini.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    scheme:
      gatherCoverageData: false

  # 诊断 A：完整 App 代码 + 规则表，但不调用任何 NetworkExtension，
  # 也不嵌入扩展。用来判断闪退是不是 nehelper 杀进程。
  SGNoNE:
    type: application
    platform: iOS
    sources:
      - path: SplashGuard/App
      - path: SplashGuard/Core
      - path: SplashGuard/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splashguard.none
        PRODUCT_NAME: SGNoNE
        INFOPLIST_FILE: SplashGuard/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: SplashGuard/Entitlements/App.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SG_NO_NETWORKEXTENSION"
    scheme:
      gatherCoverageData: false

  # 诊断 B：完整 App 代码 + 规则表 + 调 NetworkExtension，但不嵌入扩展。
  SGNoExt:
    type: application
    platform: iOS
    sources:
      - path: SplashGuard/App
      - path: SplashGuard/Core
      - path: SplashGuard/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splashguard.noext
        PRODUCT_NAME: SGNoExt
        INFOPLIST_FILE: SplashGuard/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: SplashGuard/Entitlements/App.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false
