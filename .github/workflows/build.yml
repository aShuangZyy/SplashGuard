name: build-ipa

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 自带 Xcode 16，能读 XcodeGen 写出的 objectVersion 77；
    # macos-14 默认 Xcode 15.4 会报 "future Xcode project file format"
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装工具
        run: |
          brew install xcodegen ldid
          xcodegen --version

      - name: 编译规则（仓库已带二进制表，此处仅在存在原始规则时重建）
        run: |
          if [ -d rules/vendor ] && [ -n "$(ls -A rules/vendor 2>/dev/null)" ]; then
            python3 tools/build_rules.py --raw rules/vendor --out SplashGuard/Resources
          else
            echo "跳过：没有 rules/vendor 原始规则"
          fi
          ls -la SplashGuard/Resources

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          for SCHEME in SplashGuard SplashGuardMini SGMiniObjC SGMiniEmb; do
            echo "===== building $SCHEME"
            xcodebuild \
              -project SplashGuard.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
          done
          ls -la build/Build/Products/Release-iphoneos

      - name: fakesign 并打包 IPA
        run: |
          set -euo pipefail
          PRODUCTS=build/Build/Products/Release-iphoneos

          pack() {
            local APP_NAME="$1"; local APP_ENT="$2"; local TUN_ENT="$3"; local OUT="$4"
            local D; D=$(mktemp -d)
            mkdir -p "$D/Payload"
            cp -R "$PRODUCTS/$APP_NAME.app" "$D/Payload/"
            local APPDIR="$D/Payload/$APP_NAME.app"
            local EXEC="$APPDIR/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPDIR/Info.plist")"
            echo "signing $EXEC"
            ldid -S"$APP_ENT" "$EXEC"
            # 嵌入的 Swift 运行时（SGMiniEmb/SplashGuard 若开启 embed）也要签
            for DYLIB in "$APPDIR"/Frameworks/*.dylib; do
              [ -f "$DYLIB" ] || continue
              ldid -S "$DYLIB"
            done
            if [ -n "$TUN_ENT" ]; then
              for APPEX in "$APPDIR"/PlugIns/*.appex; do
                [ -d "$APPEX" ] || continue
                local EXE="$APPEX/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist")"
                echo "signing $EXE"
                ldid -S"$TUN_ENT" "$EXE"
              done
            fi
            ( cd "$D" && zip -qry "$OLDPWD/$OUT" Payload )
            ls -lh "$OUT"
          }

          pack SplashGuard SplashGuard/Entitlements/App.entitlements \
               SplashGuard/Entitlements/Tunnel.entitlements SplashGuard.ipa

          pack SplashGuardMini SplashGuard/Entitlements/Mini.entitlements "" SplashGuardMini.ipa
          pack SGMiniObjC SplashGuard/Entitlements/Mini.entitlements "" SGMiniObjC.ipa
          pack SGMiniEmb SplashGuard/Entitlements/Mini.entitlements "" SGMiniEmb.ipa

          for F in SplashGuard.ipa SplashGuardMini.ipa SGMiniObjC.ipa SGMiniEmb.ipa; do
            echo "===== $F"
            unzip -l "$F"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SplashGuard-ipa
          path: |
            SplashGuard.ipa
            SplashGuardMini.ipa
            SGMiniObjC.ipa
            SGMiniEmb.ipa
          if-no-files-found: error
