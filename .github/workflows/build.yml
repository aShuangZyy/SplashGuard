name: build-ipa

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Xcode 16.4 + SDK 18.5（macos-15）
  build-xcode16:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装工具
        run: |
          brew install xcodegen ldid
          xcodegen --version

      - name: 编译规则（仓库已带二进制表，此处仅在存在原始规则时重建）
        run: |
          if [ -d rules/vendor ] && [ -n "$(ls -A rules/vendor 2>/dev/null)" ]; then
            python3 tools/build_rules.py --raw rules/vendor --out SplashGuard/Resources
          else
            echo "跳过：没有 rules/vendor 原始规则"
          fi
          ls -la SplashGuard/Resources

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          for SCHEME in SplashGuard SplashGuardMini SGMiniObjC SGNoNE SGNoExt; do
            echo "===== building $SCHEME"
            xcodebuild \
              -project SplashGuard.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
          done
          ls -la build/Build/Products/Release-iphoneos

      - name: fakesign 并打包 IPA
        run: |
          set -euo pipefail
          chmod +x tools/pack.sh
          tools/pack.sh SplashGuard SplashGuard/Entitlements/App.entitlements SplashGuard.ipa SplashGuard/Entitlements/Tunnel.entitlements
          tools/pack.sh SplashGuardMini SplashGuard/Entitlements/Mini.entitlements SGMini-swift16.ipa
          tools/pack.sh SGMiniObjC SplashGuard/Entitlements/Mini.entitlements SGMini-objc.ipa
          tools/pack.sh SGNoNE SplashGuard/Entitlements/DiagNE.entitlements SGNoNE.ipa
          tools/pack.sh SGNoExt SplashGuard/Entitlements/DiagExt.entitlements SGNoExt.ipa
          for F in SplashGuard.ipa SGMini-swift16.ipa SGMini-objc.ipa SGNoNE.ipa SGNoExt.ipa; do
            echo "===== $F"
            unzip -l "$F"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: xcode16
          path: |
            SplashGuard.ipa
            SGMini-swift16.ipa
            SGMini-objc.ipa
            SGNoNE.ipa
            SGNoExt.ipa

  # Xcode 15.4 + SDK 17.5（macos-14），用 Swift 5.9 编译，验证是不是工具链问题。
  # XcodeGen 会写 objectVersion 77，Xcode 15 读不了，所以生成后强行改回 56。
  build-xcode15:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装工具
        run: |
          brew install xcodegen ldid

      - name: 生成工程（降级 pbxproj 格式）
        run: |
          xcodegen generate
          PBX=SplashGuard.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PBX"
          grep -m1 objectVersion "$PBX"

      - name: 编译（不签名）
        run: |
          set -o pipefail
          for SCHEME in SplashGuard SplashGuardMini SGMiniObjC; do
            echo "===== building $SCHEME"
            xcodebuild \
              -project SplashGuard.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
          done

      - name: fakesign 并打包 IPA
        run: |
          set -euo pipefail
          chmod +x tools/pack.sh
          tools/pack.sh SplashGuard SplashGuard/Entitlements/App.entitlements SplashGuard-xc15.ipa SplashGuard/Entitlements/Tunnel.entitlements
          tools/pack.sh SplashGuardMini SplashGuard/Entitlements/Mini.entitlements SGMini-swift15.ipa
          for F in SplashGuard-xc15.ipa SGMini-swift15.ipa; do
            echo "===== $F"
            unzip -l "$F"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: xcode15
          path: |
            SplashGuard-xc15.ipa
            SGMini-swift15.ipa
